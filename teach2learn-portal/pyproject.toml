[project]
name = "teach2learn-portal"
version = "0.1.0"
description = "A focused teaching portal backed by subject-specific language-model adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.6.4",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
inference = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "peft>=0.19.1",
    "safetensors>=0.7.0",
    "torch>=2.10.0",
    "transformers>=5.5.4",
]

[project.scripts]
teach2learn = "app.main:run"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

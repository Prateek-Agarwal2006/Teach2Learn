server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name learnbyteaching.sasanktumpati.com;

    ssl_certificate /etc/letsencrypt/live/learnbyteaching.sasanktumpati.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learnbyteaching.sasanktumpati.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/teach2learn-access.log t2l_safe;
    client_max_body_size 256k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;
    reset_timedout_connection on;

    limit_req zone=t2l_requests burst=120 nodelay;
    limit_conn t2l_connections 30;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:18010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_hide_header Server;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name learnbyteaching.sasanktumpati.com;
    return 301 https://$host$request_uri;
}

# Shared relay protections. The access format deliberately logs the path but
# omits query strings so short-lived OAuth codes never land in access logs.
log_format t2l_safe '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=t2l_requests:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=t2l_connections:10m;
limit_req_status 429;
limit_conn_status 429;
server_tokens off;

# Trust the visitor address only when the immediate peer is an official
# Cloudflare edge. Direct clients cannot spoof CF-Connecting-IP.
set_real_ip_from 173.245.48.0/20;

PasswordAuthentication no
PermitRootLogin no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30

Match User t2l-tunnel
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:18010
    AllowAgentForwarding no
    PermitTTY no

Match User *,!t2l-tunnel
    AllowTcpForwarding no
    AllowAgentForwarding no
